<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}מערכת סרטונים{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎬 מערכת סרטונים אוטומטית</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}" class="nav-link">דשבורד</a>
            <a href="{{ url_for('activity_logs') }}" class="nav-link">יומן פעילות</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>מערכת יצירת סרטונים אוטומטית | גרסה 1.0</p>
    </footer>
</body>
</html>
